<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eugene's Portfolio 🩽</title>
    <style>
        /* 1. 전체적인 느낌: 화이트톤 & 깔끔 */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 2. 애니메이션 효과 (스크롤 시 등장) */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 3. 자기소개 섹션 */
        .intro-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding: 2rem;
            text-align: center;
        }

        .intro-card {
            background: #f8ffff; /* 아주 연한 Cyan 톤 */
            border: 2px solid #00ced1; /* Cyan 포인트 */
            padding: 3rem;
            border-radius: 30px; /* 유진이 요청한 둥근 모서리! */
            box-shadow: 0 10px 30px rgba(0, 206, 209, 0.1);
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem; /* 적당히 큰 글씨 */
            color: #008b8b;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            color: #555;
            word-break: keep-all;
        }

        .highlight {
            color: #00ced1;
            font-weight: bold;
        }

        .shasha-tag {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.5rem 1.2rem;
            background: #00ced1;
            color: white;
            border-radius: 50px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <section class="intro-section">
        <div class="intro-card reveal">
            <h1>HI, I'M EUGENE 🪽</h1>
            <p>
                세상에 없던 길을 찾아내는 <span class="highlight">방구석 빌더</span> 유진입니다.<br>
                복잡한 코드를 깔끔한 디자인으로 풀어내는 것을 좋아하며,<br>
                멈추지 않고 나만의 가치를 만들어갑니다. 🌊
            </p>
            <div class="shasha-tag">🐱 샤샤 집사 상주 중</div>
        </div>
    </section>

    <script>
        /* 4. 스크롤 애니메이션 작동 JS */
        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                var elementVisible = 150;
                if (elementTop < windowHeight - elementVisible) {
                    reveals[i].classList.add("active");
                }
            }
        }

        window.addEventListener("scroll", reveal);
        // 처음에 로딩될 때도 보이게 실행
        window.onload = reveal;
    </script>

</body>
</html>
