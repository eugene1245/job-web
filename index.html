<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eugene's World 🪽</title>
    <style>
        /* 1. 화면 꽉 채우는 설정 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Pretendard', sans-serif;
            background-color: #f7fbfc; /* 눈 편한 베이스 */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 2. 배경 그라데이션 (유진's Pick 파스텔 블루 #B3EBF2 활용) */
        .full-background {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #B3EBF2 100%);
            z-index: -1;
        }

        /* 3. 메인 콘텐츠 (중앙 집중) */
        .main-container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 5rem); /* 시원하게 큰 글씨 */
            color: #446a73;
            margin: 0;
            letter-spacing: -2px;
            animation: fadeInDown 1s ease-out;
        }

        p {
            font-size: 1.5rem;
            color: #7abccb;
            margin: 20px 0 40px;
            font-weight: 300;
            animation: fadeInUp 1.2s ease-out;
        }

        /* 4. 버튼 디자인 (둥글고 큼직하게) */
        .nav-button {
            display: inline-block;
            padding: 20px 50px;
            background-color: #B3EBF2; /* 유진's Pick */
            color: #446a73;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 100px; /* 둥글둥글 */
            box-shadow: 0 10px 20px rgba(179, 235, 242, 0.4);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .nav-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(179, 235, 242, 0.6);
            background-color: #ffffff;
            border: 2px solid #B3EBF2;
        }

        /* 5. 가벼운 애니메이션 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="full-background"></div>

    <div class="main-container">
        <h1>HI, I'M EUGENE 🪽</h1>
        <p>방구석에서 세상을 설계하는 빌더</p>
        
        <a href="about.html" class="nav-button">
            ENTER THE CASTLE ✨
        </a>
    </div>
</body>
</html>
